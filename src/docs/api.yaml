paths:
  /api/v1/health:
    get:
      tags:
        - Health
      summary: Health check
      description: Check if the API is running
      responses:
        200:
          description: API is running
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Eloka Pesan API is running
                  version:
                    type: string
                    example: v1
                  timestamp:
                    type: string
                    format: date-time

  /api/v1/auth/register:
    post:
      tags:
        - Auth
      summary: Register a new user
      description: Create a new customer account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - name
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
                password:
                  type: string
                  minLength: 6
                  example: password123
                name:
                  type: string
                  example: John Doe
                phone:
                  type: string
                  example: '+6281234567890'
      responses:
        201:
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Registration successful
                  data:
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/User'
                      accessToken:
                        type: string
                      refreshToken:
                        type: string
        400:
          description: Validation error or email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/auth/login:
    post:
      tags:
        - Auth
      summary: Login
      description: Authenticate user and get access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        200:
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      user:
                        $ref: '#/components/schemas/User'
                      accessToken:
                        type: string
                      refreshToken:
                        type: string
        401:
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/auth/refresh-token:
    post:
      tags:
        - Auth
      summary: Refresh access token
      description: Get a new access token using refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
      responses:
        200:
          description: Token refreshed successfully
        401:
          description: Invalid or expired refresh token

  /api/v1/auth/logout:
    post:
      tags:
        - Auth
      summary: Logout
      description: Invalidate refresh token
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
      responses:
        200:
          description: Logged out successfully

  /api/v1/users/me:
    get:
      tags:
        - Users
      summary: Get current user profile
      security:
        - bearerAuth: []
      responses:
        200:
          description: Profile retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/User'
        401:
          description: Unauthorized

    put:
      tags:
        - Users
      summary: Update current user profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                phone:
                  type: string
      responses:
        200:
          description: Profile updated successfully

  /api/v1/users/change-password:
    post:
      tags:
        - Users
      summary: Change password
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - currentPassword
                - newPassword
              properties:
                currentPassword:
                  type: string
                newPassword:
                  type: string
                  minLength: 6
      responses:
        200:
          description: Password changed successfully
        400:
          description: Current password is incorrect

  /api/v1/users/addresses:
    get:
      tags:
        - Users
      summary: Get user addresses
      security:
        - bearerAuth: []
      responses:
        200:
          description: Addresses retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Address'

    post:
      tags:
        - Users
      summary: Create new address
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - label
                - street
                - city
                - province
                - postalCode
              properties:
                label:
                  type: string
                  example: Home
                street:
                  type: string
                city:
                  type: string
                province:
                  type: string
                postalCode:
                  type: string
                coordinates:
                  type: string
                  example: '-6.2088,106.8456'
                isDefault:
                  type: boolean
      responses:
        201:
          description: Address created successfully

  /api/v1/shops:
    get:
      tags:
        - Shops
      summary: Get all shops
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: isOpen
          schema:
            type: boolean
      responses:
        200:
          description: Shops retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Shop'
                  meta:
                    type: object
                    properties:
                      page:
                        type: integer
                      limit:
                        type: integer
                      total:
                        type: integer
                      totalPages:
                        type: integer

    post:
      tags:
        - Shops
      summary: Create new shop (Admin/Staff only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - address
                - phone
                - openTime
                - closeTime
              properties:
                name:
                  type: string
                description:
                  type: string
                logo:
                  type: string
                address:
                  type: string
                phone:
                  type: string
                email:
                  type: string
                openTime:
                  type: string
                  example: '08:00'
                closeTime:
                  type: string
                  example: '22:00'
      responses:
        201:
          description: Shop created successfully
        401:
          description: Unauthorized
        403:
          description: Forbidden

  /api/v1/shops/{id}:
    get:
      tags:
        - Shops
      summary: Get shop by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        200:
          description: Shop retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Shop'
        404:
          description: Shop not found

  /api/v1/products:
    get:
      tags:
        - Products
      summary: Get all products
      parameters:
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: limit
          schema:
            type: integer
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: categoryId
          schema:
            type: string
        - in: query
          name: isAvailable
          schema:
            type: boolean
        - in: query
          name: isPopular
          schema:
            type: boolean
      responses:
        200:
          description: Products retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'
                  meta:
                    type: object

    post:
      tags:
        - Products
      summary: Create new product (Admin/Staff only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - categoryId
                - name
                - price
              properties:
                categoryId:
                  type: string
                name:
                  type: string
                description:
                  type: string
                price:
                  type: number
                image:
                  type: string
                isAvailable:
                  type: boolean
                isPopular:
                  type: boolean
                stock:
                  type: integer
      responses:
        201:
          description: Product created successfully

  /api/v1/orders/my-orders:
    get:
      tags:
        - Orders
      summary: Get current user orders
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: limit
          schema:
            type: integer
        - in: query
          name: status
          schema:
            type: string
            enum: [PENDING, CONFIRMED, PREPARING, READY, DELIVERING, COMPLETED, CANCELLED]
      responses:
        200:
          description: Orders retrieved successfully

  /api/v1/orders:
    get:
      tags:
        - Orders
      summary: Get all orders (Admin/Staff only)
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: limit
          schema:
            type: integer
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: shopId
          schema:
            type: string
      responses:
        200:
          description: Orders retrieved successfully

    post:
      tags:
        - Orders
      summary: Create new order
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - shopId
                - orderType
                - items
              properties:
                shopId:
                  type: string
                orderType:
                  type: string
                  enum: [DINE_IN, TAKEAWAY, DELIVERY]
                tableNumber:
                  type: string
                addressId:
                  type: string
                items:
                  type: array
                  items:
                    type: object
                    required:
                      - productId
                      - quantity
                    properties:
                      productId:
                        type: string
                      quantity:
                        type: integer
                      variantIds:
                        type: array
                        items:
                          type: string
                      addonIds:
                        type: array
                        items:
                          type: string
                      notes:
                        type: string
                notes:
                  type: string
      responses:
        201:
          description: Order created successfully
        400:
          description: Validation error

  /api/v1/orders/{id}:
    get:
      tags:
        - Orders
      summary: Get order by ID
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        200:
          description: Order retrieved successfully
        404:
          description: Order not found

  /api/v1/orders/{id}/status:
    patch:
      tags:
        - Orders
      summary: Update order status (Admin/Staff only)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [CONFIRMED, PREPARING, READY, DELIVERING, COMPLETED, CANCELLED]
      responses:
        200:
          description: Order status updated successfully

  /api/v1/orders/{id}/cancel:
    post:
      tags:
        - Orders
      summary: Cancel order
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        200:
          description: Order cancelled successfully
        400:
          description: Order cannot be cancelled
